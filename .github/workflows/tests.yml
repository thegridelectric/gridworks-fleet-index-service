name: Tests

on:
  - push
  - pull_request

jobs:
  lint:
    name: lint / 3.12
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups --locked
      - name: Ruff lint
        run: uv run ruff check --no-fix .
      - name: Ruff format check
        run: uv run ruff format --check .

  tests:
    name: tests / 3.12
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "1"
      # The conftest opt-in: use the CI service container instead of
      # spinning up a testcontainers Postgres.
      FIS_TEST_PG_URL: "postgresql+psycopg://fis:fispass@localhost:5432/fis"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fis
          POSTGRES_PASSWORD: fispass
          POSTGRES_DB: fis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups --locked
      - name: Run tests
        run: uv run pytest -q
