# fis_seed_request.yaml
#
# Seed request for the Fleet Index Service (FIS) Sema snapshot — the
# vocabulary FIS stores and speaks at the broker gate.
#
# Built by ./build_fis_snapshot.sh, which drives the generator in the sibling
# sema repo and copies output/sema/* into src/fis/sema/.
#
# This is currently a **dev-only snapshot**: two of the words below are
# `staging` (mutable in place while they harden), which restricts the
# snapshot to dev brokers. `fis.connect.claims` must be published before the
# staging box serves hw1__2, since it crosses the wire; the lease row may
# stay staging longer, being a Postgres row that never leaves the box.
#
# Enums arrive through type dependency closure.

# Local (Python) class/module names. The rule drops a leading gw1./gw.
# namespace segment; none of FIS's words carry one, so every name is the
# default PascalCase of the dotted TypeName (g.node.gt -> GNodeGt,
# fis.connect.claims -> FisConnectClaims). The wire identity is unchanged.
local_names:
  strip_prefixes: [gw1, gw]

initial_targets:
  types:
    # The lease row — bijective with the `lease` table. 001 carries Run,
    # because single-writer authority is per (identity, run).
    g.node.instance.gt: {}

    # The registry mirror — strict bijection with the `g_node` table.
    g.node.gt: {}

    # The mirror's seam onto the registry: seeded through the read façade
    # with a forest request, then upserted from forest broadcasts.
    g.node.forest: {}
    g.node.forest.request: {}

    # The connect-time claims payload FIS decodes at the gate.
    fis.connect.claims: {}
