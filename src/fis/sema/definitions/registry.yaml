metadata:
  registry_version: "1.0"
  last_updated: "2026-10-08T20:00:00Z"
  maintainer: "gridworks-energy"

formats:
  left.right.dot:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/left.right.dot"
    created: "2022-01-01T00:00:00Z"
    status: "published"
    description: "Dot-separated hierarchical identifier composed of lowercase alphanumeric segments"

  non.empty.string:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/non.empty.string"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "String with at least one character"

  universe.run:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/universe.run"
    created: "2026-08-14T19:30:00Z"
    status: "published"
    description: "Broker-vhost form <universe>__<run>: the universe token, a double underscore, and the run number"

  utc.milliseconds:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/utc.milliseconds"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "UTC timestamp in whole milliseconds since Unix epoch (2000–3000 range)"

  uuid4.str:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/uuid4.str"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Canonical lowercase UUIDv4 string (RFC 4122) in 8-4-4-4-12 format"

enums:
  base.g.node.class:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Universal physical ontology classification for Grid Nodes"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/base.g.node.class/000"
        created: "2026-02-22T16:43:00Z"
        status: "published"

  fis.authorization.decision:
    latest_version: "000"
    owner: jessica-millar
    enum_type: "versioned"
    description: "Authorization outcome determined by the Fleet Index Service (FIS) for a runtime instance connection attempt."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/fis.authorization.decision/000"
        created: "2026-09-04T14:40:00Z"
        status: "published"

  fis.authorization.reason:
    latest_version: "000"
    owner: jessica-millar
    enum_type: "versioned"
    description: "Why the Fleet Index Service (FIS) decided a runtime instance connection attempt as it did; each value implies one fis.authorization.decision."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/fis.authorization.reason/000"
        created: "2026-09-04T14:40:00Z"
        status: "published"

  g.node.instance.status:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Lifecycle state of a runtime instance tracked by FIS"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/g.node.instance.status/000"
        created: "2026-03-04T17:00:00Z"
        status: "published"

  g.node.instance.transport:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Transport protocol used by a runtime instance"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/g.node.instance.transport/000"
        created: "2026-03-03T17:00:00Z"
        status: "published"

  g.node.status:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Lifecycle status of a Grid Node within the registry"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/g.node.status/000"
        created: "2026-02-22T16:43:00Z"
        status: "published"

types:
  connectivity.edge.gt:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Directed topological edge connecting two Grid Nodes in the physical electric network"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/connectivity.edge.gt/000"
        created: "2026-02-23T00:00:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "g.node.status:000"
            - "uuid4.str"

  fis.connect.claims:
    latest_version: "000"
    owner: jessica-millar
    versioning_strategy: "literal"
    description: "Connect-time claims a principal presents at the broker gate for FIS authorization: current alias, runtime instance id, the run being joined, and GNodeClass iff the principal is a GNode."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/fis.connect.claims/000"
        created: "2026-08-14T19:30:00Z"
        summary: "Initial Sema version"
        status: "published"
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "non.empty.string"
            - "universe.run"
            - "uuid4.str"

  fis.instance.authorization.event:
    latest_version: "001"
    owner: jessica-millar
    versioning_strategy: "literal"
    description: "Record of one connect-gate decision by the Fleet Index Service (FIS): whether a runtime instance of a principal was admitted to a run, and why."

    versions:
      "001":
        schema_url: "https://schemas.electricity.works/types/fis.instance.authorization.event/001"
        created: "2026-10-08T19:00:00Z"
        summary: "InstanceId and Run optional, so a verdict on a request whose claims did not decode is recorded; PrincipalId and Transport stay required"
        status: "published"
        direct_dependencies:
          structural:
            - "fis.authorization.decision:000"
            - "fis.authorization.reason:000"
            - "g.node.instance.transport:000"
            - "left.right.dot"
            - "non.empty.string"
            - "universe.run"
            - "utc.milliseconds"
            - "uuid4.str"

  g.node.forest:
    latest_version: "002"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "A forest of Grid Node subtrees: the subtrees under one or more root aliases, carried as their current GNodes plus the connectivity edges wiring them together."

    versions:
      "002":
        schema_url: "https://schemas.electricity.works/types/g.node.forest/002"
        created: "2026-08-06T13:25:00Z"
        status: "published"
        summary: "- Nodes rebind to g.node.gt:006; SendTimeMs joins required"
        direct_dependencies:
          structural:
            - "connectivity.edge.gt:000"
            - "g.node.gt:006"
            - "left.right.dot"
            - "utc.milliseconds"

  g.node.forest.request:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "A read query for one or more Grid Node forests: the caller names root aliases and correlates the response by RequestId."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/g.node.forest.request/000"
        created: "2026-07-03T18:55:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "uuid4.str"

  g.node.gt:
    latest_version: "006"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Fundamental identity object representing physical and logical grid nodes"

    versions:
      "006":
        schema_url: "https://schemas.electricity.works/types/g.node.gt/006"
        created: "2026-08-06T13:25:00Z"
        status: "published"
        summary: "- Axiom 2 (PhysicalGNodeLocations) becomes activation-conditioned: PositionPointId is mandatory only when Status is Active — a Pending physical GNode may be locationless"
        direct_dependencies:
          structural:
            - "base.g.node.class:000"
            - "g.node.status:000"
            - "left.right.dot"
            - "uuid4.str"

  g.node.instance.gt:
    latest_version: "001"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Runtime execution instance of a GNode identity on one run"

    versions:
      "001":
        schema_url: "https://schemas.electricity.works/types/g.node.instance.gt/001"
        created: "2026-08-14T20:10:00Z"
        status: "published"
        summary: "- Run: add"
        direct_dependencies:
          structural:
            - "g.node.instance.status:000"
            - "g.node.instance.transport:000"
            - "universe.run"
            - "utc.milliseconds"
            - "uuid4.str"
