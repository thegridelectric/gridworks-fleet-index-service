# Seed request for the fis Sema snapshot — minimum cover of what fis speaks:
# its own claims word, the auth event it records (its two enums arrive by
# closure), plus the registry-mirror message types. Everything else
# in the snapshot (g.node.gt, connectivity.edge.gt, the g-node enums, formats)
# arrives through dependency closure — g.node.forest:002 structurally pins
# g.node.gt:006, so it is not seeded directly. Versions are explicit: fis is
# an authority-plane prod service, so the snapshot never chases latest
# silently; widen a pin deliberately.
# Regenerate the vendored snapshot with:
#
#   scripts/regen_sema_snapshot.sh

initial_targets:
  types:
    fis.connect.claims:
      versions: ["000"]
    fis.instance.authorization.event:
      versions: ["001"]
    g.node.forest:
      versions: ["002"]
    g.node.forest.request:
      versions: ["000"]
    g.node.instance.gt:
      versions: ["001"]
